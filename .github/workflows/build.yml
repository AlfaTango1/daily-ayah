name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|AAPT|Execution failed" -A2 build.log \
            | grep -v '^--$' | head -40 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DailyAyah-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyAyah-apk
          path: DailyAyah-${{ github.run_number }}.apk

      - name: Publish release (easy download from the phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "DailyAyah-${{ github.run_number }}.apk" \
            --title "Daily Ayah build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}. Download the .apk on your phone and install it."
